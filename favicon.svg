  <rect x="12.5" y="14.2" width="10" height="1.5" rx="0.75" fill="#000" fill-opacity="0.22"/>
  <rect x="12.5" y="17" width="7.5" height="1.5" rx="0.75" fill="#000" fill-opacity="0.22"/>
  <rect x="12.5" y="21" width="10" height="1.5" rx="0.75" fill="#000" fill-opacity="0.12"/>
  <rect x="12.5" y="23.8" width="6" height="1.5" rx="0.75" fill="#000" fill-opacity="0.12"/>
  <!-- right TOC -->
  <rect x="25" y="7" width="2.2" height="1.4" rx="0.7" fill="#b3402a" fill-opacity="0.85"/>
  <rect x="25" y="10" width="2.2" height="1.4" rx="0.7" fill="#000" fill-opacity="0.2"/>
  <rect x="25" y="13" width="2.2" height="1.4" rx="0.7" fill="#000" fill-opacity="0.2"/>
</svg>
