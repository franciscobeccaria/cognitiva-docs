  <rect x="0.5" y="0.5" width="31" height="31" rx="6.5" fill="none" stroke="#000" stroke-opacity="0.08"/>
  <!-- left sidebar -->
  <rect x="5" y="7" width="5" height="2" rx="1" fill="#b3402a"/>
  <rect x="5" y="11" width="5" height="1.6" rx="0.8" fill="#000" fill-opacity="0.28"/>
  <rect x="5" y="14.4" width="5" height="1.6" rx="0.8" fill="#000" fill-opacity="0.28"/>
  <rect x="5" y="17.8" width="5" height="1.6" rx="0.8" fill="#000" fill-opacity="0.28"/>
